name: Ferozo Morón release
on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - index.html
      - vite.config.js
      - .github/workflows/ferozo-release.yml
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test Google Sheets CSV parser
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {parsePublishedCsv} from './src/utils/parseCsv.js'
          const csv = 'key,value\r\na,"Hola, mundo"\r\nb,"Línea 1\nLínea 2"\r\nc,"Nombre ""doble"""\r\n'
          assert.deepEqual(parsePublishedCsv(csv), [['key','value'],['a','Hola, mundo'],['b','Línea 1\nLínea 2'],['c','Nombre "doble"']])
          assert.deepEqual(parsePublishedCsv('\uFEFFkey,value\r\nx,ok'), [['key','value'],['x','ok']])
          console.log('PASS: CSV quotes, commas, multiline, UTF-8 BOM and CRLF')
          NODE
      - name: Install and build
        run: npm ci --no-audit --no-fund && npm run build
      - name: Check new El Ángel links
        run: |
          grep -R -q 'https://sepelioselangel.com.ar/' dist
          if grep -R -q 'https://sepelios-el-angel.onrender.com/' dist; then
            echo "ERROR: old staging link remains"
            exit 1
          fi
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/og-image.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
      - uses: actions/upload-artifact@v4
        with:
          name: sepelios-moron-ferozo
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
