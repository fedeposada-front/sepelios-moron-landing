name: Morón CMS v4 QA and Ferozo package
on:
  push:
    branches:
      - fix/moron-images-footer-20261127
    paths:
      - moron-web-cms.js
      - tests/moron-cms-v3.test.mjs
      - tests/moron-cms-v4.test.mjs
      - .github/workflows/moron-cms-v4-release.yml
  workflow_dispatch:
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check moron-web-cms.js
      - name: Check price, hero and linked Google Sheets values
        run: node tests/moron-cms-v3.test.mjs
      - name: Check images, remote URL, duplicate footer link and email
        run: node tests/moron-cms-v4.test.mjs
      - name: Package single Ferozo replacement
        uses: actions/upload-artifact@v4
        with:
          name: sepelios-moron-cms-v4-ferozo
          path: moron-web-cms.js
          if-no-files-found: error
          retention-days: 14
